<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Management | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Scoped CSS -->
    <link rel="stylesheet" href="/css/admin_booking.css">
</head>

<body class="hust-admin-trip">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking" class="indam">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container">
    <div class="left">
        <p>Booking Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="search-container">
    <input type="text" id="bookingInput" onkeyup="if(event.key === 'Enter') fetchOrdersWithSearch()" placeholder="Search">
    <button onclick="fetchOrdersWithSearch()" class="search-btn"><i class="fas fa-search"></i> Search</button>
</div>

<div class="table-wrapper">
    <table id="bookingTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Booking Date</th>
            <th>Customer</th>
            <th>Destination</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Airline</th>
            <th>Hotel</th>
            <th>Total Price</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
    <div id="pagination" class="pagination"></div>
</div>

<div id="payment-modal" class="modal">
    <div class="modal-content">
        <h2>Verify Payment</h2>
        <p>Do you want to confirm or reject this payment?</p>
        <div class="modal-btn-group">
            <button id="confirm-success-btn" class="modal-btn btn-success">Confirm</button>
            <button id="confirm-failed-btn" class="modal-btn btn-fail">Reject</button>
            <button id="close-modal-btn" class="modal-btn btn-close">Close</button>
        </div>
    </div>
</div>

<script>
    // --- UTILS: TIME & MENU ---
    function updateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- ORDER LOGIC ---
    let currentOrderId = null;
    let currentPage = 0;
    const pageSize = 5;

    document.addEventListener("DOMContentLoaded", function () {
        fetchOrders(currentPage);
    });

    function fetchOrders(page) {
        fetch(`/order/getAllOrder?pageNo=${page}&pageSize=${pageSize}`)
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000 && data.data.items.length > 0) {
                    renderOrderTable(data.data.items);
                    renderPagination(data.data.totalPages);
                } else {
                    console.error("No orders found or error:", data.message);
                    document.querySelector("#bookingTable tbody").innerHTML =
                        "<tr><td colspan='11' style='text-align:center'>No orders found</td></tr>";
                }
            })
            .catch(error => console.error("Error fetching orders:", error));
    }

    function renderOrderTable(orders) {
        const tableBody = document.querySelector("#bookingTable tbody");
        tableBody.innerHTML = "";

        orders.forEach(order => {
            const row = document.createElement("tr");
            let statusClass = '';
            let statusText = 'Unpaid';

            if(order.payment) {
                if(order.payment.status === 'PAID') { statusClass = 'status-paid'; statusText = 'Paid'; }
                else if(order.payment.status === 'VERIFYING') { statusClass = 'status-verifying'; statusText = 'Verifying'; }
                else if(order.payment.status === 'PAYMENT_FAILED') { statusClass = 'status-unpaid'; statusText = 'Failed'; }
            }

            row.innerHTML = `
                <td>${order.id}</td>
                <td>${formatDateTime(order.orderDate)}</td>
                <td>${order.user ? order.user.fullName : 'Guest'}</td>
                <td>${order.destination}</td>
                <td>${formatDate(order.checkinDate)}</td>
                <td>${formatDate(order.checkoutDate)}</td>
                <td>${order.flight ? order.flight.airlineName : "N/A"}</td>
                <td>${order.hotel ? order.hotel.hotelName : "N/A"}</td>
                <td>${order.totalPrice.toLocaleString()}</td>
                <td class="${statusClass}">${statusText}</td>
                <td>
                    ${order.payment && order.payment.status === 'VERIFYING'
                        ? `<button class="confirm-btn btn-verify" onclick="openPaymentModal(${order.id})">Verify</button>`
                        : ''}
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function formatDateTime(dateTimeString) {
        if (!dateTimeString) return "N/A";
        return new Date(dateTimeString).toLocaleString();
    }

    function formatDate(dateString) {
        if (!dateString) return "N/A";
        return new Date(dateString).toLocaleDateString();
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById("pagination");
        paginationContainer.innerHTML = "";

        for (let i = 0; i < totalPages; i++) {
            const button = document.createElement("button");
            button.textContent = i + 1;
            button.classList.add("pagination-btn");
            if (i === currentPage) button.classList.add("active");

            button.onclick = function () {
                currentPage = i;
                fetchOrders(currentPage);
            };
            paginationContainer.appendChild(button);
        }
    }

    function fetchOrdersWithSearch() {
        let searchQuery = document.getElementById("bookingInput").value.trim();
        if (searchQuery === "") {
            fetchOrders(currentPage);
            return;
        }

        fetch(`/order/getAllOrderWithMultipleColumnsWithSearch?pageNo=${currentPage}&pageSize=${pageSize}&search=${searchQuery}&sortBy=totalPrice:asc`)
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000 && data.data.items.length > 0) {
                    renderOrderTable(data.data.items);
                    renderPagination(data.data.totalPages);
                } else {
                    alert("No matching orders found.");
                    fetchOrders(currentPage);
                }
            })
            .catch(error => console.error("Error searching:", error));
    }

    // --- PAYMENT CONFIRMATION LOGIC ---
    function openPaymentModal(orderId) {
        currentOrderId = orderId;
        document.getElementById('payment-modal').style.display = 'flex';
    }

    document.getElementById('close-modal-btn').onclick = function() {
        document.getElementById('payment-modal').style.display = 'none';
    }

    document.getElementById('confirm-success-btn').addEventListener('click', function () {
        if (currentOrderId) {
            fetch(`/order/${currentOrderId}/confirm-payment`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    alert("Payment Confirmed Successfully!");
                    Promise.all([
                        fetch(`/api/v1/email/${currentOrderId}/announce-pay-success`, { method: "POST" }),
                        new Promise(resolve => setTimeout(resolve, 500))
                    ]).then(() => fetchOrders(currentPage));
                } else {
                    alert("Confirmation Failed: " + data.message);
                }
            })
            .catch(() => alert("Error confirming payment."))
            .finally(() => {
                document.getElementById('payment-modal').style.display = 'none';
            });
        }
    });

    document.getElementById('confirm-failed-btn').addEventListener('click', function () {
        if (currentOrderId) {
            fetch(`/order/${currentOrderId}/payment-falled`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    alert("Payment Rejected!");
                    Promise.all([
                        fetch(`/api/v1/email/${currentOrderId}/announce-pay-falled`, { method: "POST" }),
                        new Promise(resolve => setTimeout(resolve, 500))
                    ]).then(() => fetchOrders(currentPage));
                } else {
                    alert("Rejection Failed: " + data.message);
                }
            })
            .catch(() => alert("Error rejecting payment."))
            .finally(() => {
                document.getElementById('payment-modal').style.display = 'none';
            });
        }
    });
</script>
</body>
</html>
