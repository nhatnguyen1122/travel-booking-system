<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Management | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        :root {
            --primary: #29b862;
            --primary-dark: #1e8544;
            --text-dark: #1d1d1d;
            --text-light: #666;
            --white: #fff;
            --bg-light: #f9f9f9;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --radius: 12px;
            --danger: #e74c3c;
            --info: #3498db;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            transition: all .2s linear;
        }

        body {
            background-color: var(--bg-light);
            padding-top: 80px;
        }

        /* --- ADMIN HEADER --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5%;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
        }

        header .logo span { color: var(--primary); }

        header .bar {
            display: flex;
            gap: 20px;
        }

        header .bar a {
            font-size: 0.9rem;
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        header .bar a:hover, header .bar a.indam {
            color: var(--primary);
        }

        header .icons {
            display: flex;
            align-items: center;
        }

        header .icons i {
            font-size: 1.1rem;
            color: var(--white);
            cursor: pointer;
            margin-left: 15px;
        }

        header .icons i:hover { color: var(--primary); }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px; right: 5%;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 150px;
            overflow: hidden;
            flex-direction: column;
            z-index: 1001;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        /* --- INFO BAR --- */
        .container {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .container .left p {
            font-size: 1.5rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .container .right {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* --- SEARCH SECTION --- */
        .search-container {
            padding: 0 5%;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-container input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 300px;
            outline: none;
        }

        .search-container input:focus {
            border-color: var(--primary);
        }

        .search-btn {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .search-btn:hover { background-color: var(--primary-dark); }

        /* --- TABLE --- */
        .table-wrapper {
            padding: 0 5%;
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 0.9rem;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        tr:hover { background-color: #f1f1f1; }

        .status-paid { color: var(--primary); font-weight: 600; }
        .status-unpaid { color: var(--danger); font-weight: 600; }
        .status-verifying { color: var(--info); font-weight: 600; }

        /* --- ACTION BUTTONS --- */
        .confirm-btn {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            color: white;
            transition: 0.3s;
        }

        .btn-verify { background-color: var(--info); }
        .btn-verify:hover { background-color: #2980b9; }

        /* --- PAGINATION --- */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .pagination-btn {
            padding: 8px 15px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .pagination-btn.active, .pagination-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h2 { margin-bottom: 15px; color: var(--text-dark); }
        .modal-content p { margin-bottom: 25px; color: var(--text-light); }

        .modal-btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-success { background-color: var(--success); }
        .btn-fail { background-color: var(--danger); }
        .btn-close { background-color: #95a5a6; }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking" class="indam">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container">
    <div class="left">
        <p>Booking Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="search-container">
    <input type="text" id="bookingInput" onkeyup="if(event.key === 'Enter') fetchOrdersWithSearch()" placeholder="Search">
    <button onclick="fetchOrdersWithSearch()" class="search-btn"><i class="fas fa-search"></i> Search</button>
</div>

<div class="table-wrapper">
    <table id="bookingTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Booking Date</th>
            <th>Customer</th>
            <th>Destination</th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Airline</th>
            <th>Hotel</th>
            <th>Total Price</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <div id="pagination" class="pagination"></div>
</div>

<div id="payment-modal" class="modal">
    <div class="modal-content">
        <h2>Verify Payment</h2>
        <p>Do you want to confirm or reject this payment?</p>
        <div class="modal-btn-group">
            <button id="confirm-success-btn" class="modal-btn btn-success">Confirm</button>
            <button id="confirm-failed-btn" class="modal-btn btn-fail">Reject</button>
            <button id="close-modal-btn" class="modal-btn btn-close">Close</button>
        </div>
    </div>
</div>

<script>
    // --- UTILS: TIME & MENU ---
    function updateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- ORDER LOGIC ---
    let currentOrderId = null;
    let currentPage = 0;
    const pageSize = 5;

    document.addEventListener("DOMContentLoaded", function () {
        fetchOrders(currentPage);
    });

    function fetchOrders(page) {
        fetch(`/order/getAllOrder?pageNo=${page}&pageSize=${pageSize}`)
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000 && data.data.items.length > 0) {
                    renderOrderTable(data.data.items);
                    renderPagination(data.data.totalPages);
                } else {
                    console.error("No orders found or error:", data.message);
                    document.querySelector("#bookingTable tbody").innerHTML = "<tr><td colspan='11' style='text-align:center'>No orders found</td></tr>";
                }
            })
            .catch(error => console.error("Error fetching orders:", error));
    }

    function renderOrderTable(orders) {
        const tableBody = document.querySelector("#bookingTable tbody");
        tableBody.innerHTML = "";

        orders.forEach(order => {
            const row = document.createElement("tr");
            let statusClass = '';
            let statusText = 'Unpaid';

            if(order.payment) {
                if(order.payment.status === 'PAID') { statusClass = 'status-paid'; statusText = 'Paid'; }
                else if(order.payment.status === 'VERIFYING') { statusClass = 'status-verifying'; statusText = 'Verifying'; }
                else if(order.payment.status === 'PAYMENT_FAILED') { statusClass = 'status-unpaid'; statusText = 'Failed'; }
            }

            row.innerHTML = `
                <td>${order.id}</td>
                <td>${formatDateTime(order.orderDate)}</td>
                <td>${order.user ? order.user.fullName : 'Guest'}</td>
                <td>${order.destination}</td>
                <td>${formatDate(order.checkinDate)}</td>
                <td>${formatDate(order.checkoutDate)}</td>
                <td>${order.flight ? order.flight.airlineName : "N/A"}</td>
                <td>${order.hotel ? order.hotel.hotelName : "N/A"}</td>
                <td>${order.totalPrice.toLocaleString()}</td>
                <td class="${statusClass}">${statusText}</td>
                <td>
                    ${order.payment && order.payment.status === 'VERIFYING'
                        ? `<button class="confirm-btn btn-verify" onclick="openPaymentModal(${order.id})">Verify</button>`
                        : ''}
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function formatDateTime(dateTimeString) {
        if (!dateTimeString) return "N/A";
        return new Date(dateTimeString).toLocaleString();
    }

    function formatDate(dateString) {
        if (!dateString) return "N/A";
        return new Date(dateString).toLocaleDateString();
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById("pagination");
        paginationContainer.innerHTML = "";

        for (let i = 0; i < totalPages; i++) {
            const button = document.createElement("button");
            button.textContent = i + 1;
            button.classList.add("pagination-btn");
            if (i === currentPage) button.classList.add("active");

            button.onclick = function () {
                currentPage = i;
                fetchOrders(currentPage);
            };
            paginationContainer.appendChild(button);
        }
    }

    function fetchOrdersWithSearch() {
        let searchQuery = document.getElementById("bookingInput").value.trim();
        if (searchQuery === "") {
            fetchOrders(currentPage);
            return;
        }

        fetch(`/order/getAllOrderWithMultipleColumnsWithSearch?pageNo=${currentPage}&pageSize=${pageSize}&search=${searchQuery}&sortBy=totalPrice:asc`)
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000 && data.data.items.length > 0) {
                    renderOrderTable(data.data.items);
                    renderPagination(data.data.totalPages);
                } else {
                    alert("No matching orders found.");
                    fetchOrders(currentPage); // Reload original list
                }
            })
            .catch(error => console.error("Error searching:", error));
    }

    // --- PAYMENT CONFIRMATION LOGIC ---
    function openPaymentModal(orderId) {
        currentOrderId = orderId;
        document.getElementById('payment-modal').style.display = 'flex';
    }

    document.getElementById('close-modal-btn').onclick = function() {
        document.getElementById('payment-modal').style.display = 'none';
    }

    document.getElementById('confirm-success-btn').addEventListener('click', function () {
        if (currentOrderId) {
            fetch(`/order/${currentOrderId}/confirm-payment`, {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    alert("Payment Confirmed Successfully!");
                    // Trigger email notification
                    Promise.all([
                        fetch(`/api/v1/email/${currentOrderId}/announce-pay-success`, { method: "POST" }),
                        new Promise(resolve => setTimeout(resolve, 500))
                    ]).then(() => {
                        fetchOrders(currentPage);
                    });
                } else {
                    alert("Confirmation Failed: " + data.message);
                }
            })
            .catch(error => alert("Error confirming payment."))
            .finally(() => {
                document.getElementById('payment-modal').style.display = 'none';
            });
        }
    });

    document.getElementById('confirm-failed-btn').addEventListener('click', function () {
        if (currentOrderId) {
            fetch(`/order/${currentOrderId}/payment-falled`, { // Keep original endpoint name
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    alert("Payment Rejected!");
                    // Trigger email notification
                    Promise.all([
                        fetch(`/api/v1/email/${currentOrderId}/announce-pay-falled`, { method: "POST" }),
                        new Promise(resolve => setTimeout(resolve, 500))
                    ]).then(() => {
                        fetchOrders(currentPage);
                    });
                } else {
                    alert("Rejection Failed: " + data.message);
                }
            })
            .catch(error => alert("Error rejecting payment."))
            .finally(() => {
                document.getElementById('payment-modal').style.display = 'none';
            });
        }
    });
</script>
</body>
</html>
