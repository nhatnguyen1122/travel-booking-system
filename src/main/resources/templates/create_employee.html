<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- CSS ở /css/ -->
    <link rel="stylesheet" href="/css/create_employee.css">
</head>

<body class="hust-create-employee-page">

<header>
    <a href="#" class="logo"><span>Future</span>Wonders</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account" class="indam">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="form-container">
    <h2>Create New Employee</h2>
    <form id="createStaffForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="btn-submit">Create Employee</button>
        <a href="admin_account" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back to Management
        </a>
    </form>
</div>

<script>
    // --- USER MENU LOGIC ---
    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- FORM SUBMIT LOGIC ---
    document.getElementById("createStaffForm").addEventListener("submit", function(event) {
        event.preventDefault();
        var formData = new FormData(this);

        if (formData.get("password") !== formData.get("confirmPassword")) {
            alert("Passwords do not match!");
            return;
        }

        var data = {
            name: formData.get("name"),
            email: formData.get("email"),
            telephone: formData.get("phone"),
            password: formData.get("password"),
            confirmPassword: formData.get("confirmPassword"),
            roles: "admin"
        };

        fetch("api/auth/createStaff", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Employee created successfully!");
                window.location.href = "admin_account";
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while creating the employee.");
        });
    });
</script>

</body>
</html>
