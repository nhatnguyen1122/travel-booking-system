<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- CSS tách ra -->
    <link rel="stylesheet" href="/css/profile.css">
</head>

<body class="hust-profile-page">

<header>
    <a href="home" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="video-container">
    <div class="video-overlay"></div>
    <video src="/images/ocean.mp4" loop autoplay muted></video>
</div>

<div class="profile-container">
    <div class="profile-header">
        <div class="avatar-circle">
            <i class="fas fa-user"></i>
        </div>
        <h2>My Profile</h2>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="user-fullname">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="user-phone">
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="text" id="user-email">
    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="text" id="user-birthday" onfocus="(this.type='date')">
    </div>

    <div class="btn-group">
        <button id="update-btn" class="btn btn-update">Update Info</button>

        <a href="newPass" class="btn-link">
            <button class="btn btn-password" type="button">Change Password</button>
        </a>
    </div>
</div>

<div class="booking-history-container">
    <h2>My Booking History</h2>
    <div id="bookings-list" class="bookings-list">
        <!-- Bookings will be loaded here dynamically -->
    </div>
</div>

<!-- Review Modal -->
<div id="review-modal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Write a Review</h2>
        <div id="review-hotel-name" class="hotel-name-display"></div>
        <form id="review-form">
            <div class="rating-input">
                <label>Rating:</label>
                <div class="star-rating">
                    <i class="far fa-star" data-rating="1"></i>
                    <i class="far fa-star" data-rating="2"></i>
                    <i class="far fa-star" data-rating="3"></i>
                    <i class="far fa-star" data-rating="4"></i>
                    <i class="far fa-star" data-rating="5"></i>
                </div>
                <input type="hidden" id="rating-value" required>
            </div>
            <div class="comment-input">
                <label>Comment:</label>
                <textarea id="comment-value" rows="5" maxlength="1000" placeholder="Share your experience..."></textarea>
            </div>
            <button type="submit" class="btn btn-submit-review">Submit Review</button>
        </form>
    </div>
</div>

<script>
    // Logic Toggle Menu
    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");

        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // Global variables
    let currentOrderId = null;
    let currentUserId = null;

    // Star rating functionality
    function initStarRating() {
        const stars = document.querySelectorAll('.star-rating i');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                document.getElementById('rating-value').value = rating;
                updateStars(rating);
            });
            star.addEventListener('mouseover', function() {
                const rating = parseInt(this.getAttribute('data-rating'));
                updateStars(rating);
            });
        });

        document.querySelector('.star-rating').addEventListener('mouseleave', function() {
            const currentRating = parseInt(document.getElementById('rating-value').value) || 0;
            updateStars(currentRating);
        });
    }

    function updateStars(rating) {
        const stars = document.querySelectorAll('.star-rating i');
        stars.forEach((star, index) => {
            if (index < rating) {
                star.classList.remove('far');
                star.classList.add('fas');
            } else {
                star.classList.remove('fas');
                star.classList.add('far');
            }
        });
    }

    // Modal functionality
    function openReviewModal(orderId, hotelName) {
        currentOrderId = orderId;
        document.getElementById('review-hotel-name').textContent = hotelName;
        document.getElementById('rating-value').value = '';
        document.getElementById('comment-value').value = '';
        updateStars(0);
        document.getElementById('review-modal').style.display = 'block';
    }

    function closeReviewModal() {
        document.getElementById('review-modal').style.display = 'none';
        currentOrderId = null;
    }

    // Load bookings
    function loadBookings(userId) {
        fetch(`/order/${userId}?pageNo=0&pageSize=100`)
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    const orders = apiResponse.data.items || [];
                    displayBookings(orders);
                } else {
                    document.getElementById('bookings-list').innerHTML = '<p>No bookings found.</p>';
                }
            })
            .catch(error => {
                console.error("Error loading bookings:", error);
                document.getElementById('bookings-list').innerHTML = '<p>Error loading bookings.</p>';
            });
    }

    function displayBookings(bookings) {
        const bookingsList = document.getElementById('bookings-list');

        if (!bookings || bookings.length === 0) {
            bookingsList.innerHTML = '<p>No bookings found.</p>';
            return;
        }

        bookingsList.innerHTML = bookings.map(order => {
            const isPaid = order.payment && order.payment.status === 'PAID';
            const hasHotel = order.hotel != null;
            const canReview = isPaid && hasHotel;
            // Show Mark as Paid button if payment is not PAID (including null, UNPAID, PENDING, etc.)
            const isUnpaid = !isPaid;

            return `
                <div class="booking-card">
                    <div class="booking-info">
                        <h3>${order.hotel ? order.hotel.hotelName : 'N/A'}</h3>
                        <p><strong>Order ID:</strong> ${order.id}</p>
                        <p><strong>Total Price:</strong> $${order.totalPrice || 0}</p>
                        <p><strong>Status:</strong> <span class="status-${order.payment?.status?.toLowerCase() || 'pending'}">${order.payment?.status || 'NOT PAID'}</span></p>
                        ${order.hotelBooking ? `<p><strong>Check-in:</strong> ${order.hotelBooking.checkInDate} | <strong>Check-out:</strong> ${order.hotelBooking.checkOutDate}</p>` : ''}
                    </div>
                    <div class="booking-actions">
                        ${isUnpaid ? `
                            <button class="btn btn-mark-paid" onclick="markAsPaid(${order.id})">
                                Mark as Paid (Test)
                            </button>
                        ` : ''}
                        ${canReview ? `
                            <button class="btn btn-review" onclick="checkAndOpenReview(${order.id}, '${order.hotel.hotelName}')">
                                Write Review
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function markAsPaid(orderId) {
        if (!confirm('Mark this order as PAID for testing?')) return;

        fetch(`/order/${orderId}/confirm-payment`, {
            method: 'POST'
        })
        .then(response => response.json())
        .then(apiResponse => {
            if (apiResponse.code === 1000 || apiResponse.message === 'confirm payment success') {
                alert('Order marked as PAID!');
                loadBookings(currentUserId);
            } else {
                alert('Failed to mark as paid: ' + (apiResponse.message || 'Unknown error'));
            }
        })
        .catch(error => {
            console.error("Error marking as paid:", error);
            alert('Error marking as paid. Please try again.');
        });
    }

    function checkAndOpenReview(orderId, hotelName) {
        fetch(`/review/order/${orderId}`)
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.data) {
                    alert('You have already reviewed this booking!');
                } else {
                    openReviewModal(orderId, hotelName);
                }
            })
            .catch(error => {
                console.error("Error checking review:", error);
                openReviewModal(orderId, hotelName);
            });
    }

    // Logic lấy và cập nhật thông tin user
    document.addEventListener("DOMContentLoaded", function () {
        let userId = localStorage.getItem("userId");
        currentUserId = userId;

        if (!userId) {
            alert("Please log in first.");
            window.location.href = "/user";
            return;
        }

        // Initialize star rating
        initStarRating();

        // Modal close functionality
        document.querySelector('.close').addEventListener('click', closeReviewModal);
        window.addEventListener('click', function(event) {
            if (event.target == document.getElementById('review-modal')) {
                closeReviewModal();
            }
        });

        // Review form submission
        document.getElementById('review-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const rating = parseInt(document.getElementById('rating-value').value);
            const comment = document.getElementById('comment-value').value;

            if (!rating || rating < 1 || rating > 5) {
                alert('Please select a rating (1-5 stars)');
                return;
            }

            const reviewData = {
                rating: rating,
                comment: comment
            };

            fetch(`/review/${currentOrderId}/${currentUserId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reviewData)
            })
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    alert('Review submitted successfully!');
                    closeReviewModal();
                    loadBookings(currentUserId);
                } else {
                    alert('Failed to submit review: ' + (apiResponse.message || 'Unknown error'));
                }
            })
            .catch(error => {
                console.error("Error submitting review:", error);
                alert('Error submitting review. Please try again.');
            });
        });

        // Fetch user info
        fetch(`/user/${userId}`)
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    let user = apiResponse.data;
                    document.getElementById("user-phone").value = user.phone || "";
                    document.getElementById("user-fullname").value = user.fullName || "";
                    document.getElementById("user-email").value = user.email || "";
                    document.getElementById("user-birthday").value = user.birthday || "";
                } else {
                    alert("Could not load user information.");
                }
            })
            .catch(error => console.error("API Error:", error));

        // Load booking history
        loadBookings(userId);

        // Update info logic
        document.getElementById("update-btn").addEventListener("click", function () {
            let updatedUser = {
                phone: document.getElementById("user-phone").value,
                fullName: document.getElementById("user-fullname").value,
                email: document.getElementById("user-email").value,
                birthday: document.getElementById("user-birthday").value
            };

            fetch(`/user/update/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            })
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    alert("Update successful!");
                } else {
                    alert("Update failed.");
                }
            })
            .catch(error => console.error("Error updating:", error));
        });
    });
</script>

</body>
</html>
