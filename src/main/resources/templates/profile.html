<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- CSS tách ra -->
    <link rel="stylesheet" href="/css/profile.css">
</head>

<body class="hust-profile-page">

<header>
    <a href="home" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="video-container">
    <div class="video-overlay"></div>
    <video src="/images/ocean.mp4" loop autoplay muted></video>
</div>

<div class="profile-container">
    <div class="profile-header">
        <div class="avatar-circle">
            <i class="fas fa-user"></i>
        </div>
        <h2>My Profile</h2>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="user-fullname">
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="user-phone">
    </div>

    <div class="form-group">
        <label>Email Address</label>
        <input type="text" id="user-email">
    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="text" id="user-birthday" onfocus="(this.type='date')">
    </div>

    <div class="btn-group">
        <button id="update-btn" class="btn btn-update">Update Info</button>

        <a href="newPass" class="btn-link">
            <button class="btn btn-password" type="button">Change Password</button>
        </a>
    </div>
</div>

<script>
    // Logic Toggle Menu
    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");

        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // Logic lấy và cập nhật thông tin user
    document.addEventListener("DOMContentLoaded", function () {
        let userId = localStorage.getItem("userId");

        if (!userId) {
            alert("Please log in first.");
            window.location.href = "/user";
            return;
        }

        // Fetch user info
        fetch(`/user/${userId}`)
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    let user = apiResponse.data;
                    document.getElementById("user-phone").value = user.phone || "";
                    document.getElementById("user-fullname").value = user.fullName || "";
                    document.getElementById("user-email").value = user.email || "";
                    document.getElementById("user-birthday").value = user.birthday || "";
                } else {
                    alert("Could not load user information.");
                }
            })
            .catch(error => console.error("API Error:", error));

        // Update info logic
        document.getElementById("update-btn").addEventListener("click", function () {
            let updatedUser = {
                phone: document.getElementById("user-phone").value,
                fullName: document.getElementById("user-fullname").value,
                email: document.getElementById("user-email").value,
                birthday: document.getElementById("user-birthday").value
            };

            fetch(`/user/update/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            })
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    alert("Update successful!");
                } else {
                    alert("Update failed.");
                }
            })
            .catch(error => console.error("Error updating:", error));
        });
    });
</script>

</body>
</html>
