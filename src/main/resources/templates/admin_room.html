<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <link rel="stylesheet" href="/css/admin_room.css">
</head>

<body class="hust-admin-room">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
        <a href="admin_room" class="indam">Manage Rooms</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Room Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label for="hotelSelect">Select Hotel:</label>
        <select id="hotelSelect" class="form-control" onchange="fetchRooms()">
            <option value="">-- Select a Hotel --</option>
        </select>
    </div>

    <button class="btn btn-create" onclick="openAddModal()" id="addRoomBtn" disabled>
        <i class="fas fa-plus"></i> Add New Room
    </button>
</div>

<div class="table-wrapper">
    <table id="roomTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Room Number</th>
            <th>Room Type</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="roomTableBody">
        <tr>
            <td colspan="5" class="empty-message">Please select a hotel to view rooms</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div id="pagination" class="pagination"></div>
</div>

<div id="roomModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Room</h3>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="roomId">
            <div class="form-group">
                <label>Room Number</label>
                <input type="number" id="roomNumber" class="form-control" placeholder="e.g., 101">
            </div>
            <div class="form-group">
                <label>Room Type</label>
                <select id="roomType" class="form-control">
                    <option value="Normal Room">Normal Room</option>
                    <option value="Vip Room">Vip Room</option>
                    <option value="Deluxe Room">Deluxe Room</option>
                    <option value="Suite">Suite</option>
                    <option value="Presidential Suite">Presidential Suite</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (VND)</label>
                <input type="number" id="roomPrice" class="form-control" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-create" id="saveRoomBtn">Save</button>
        </div>
    </div>
</div>

<script src="/js/admin_room.js"></script>
</body>
</html>
