<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <link rel="stylesheet" href="/css/admin_room.css">
</head>

<body class="hust-admin-room">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
        <a href="admin_room" class="indam">Manage Rooms</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Room Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="filter-bar">
    <div class="filter-group">
        <label for="hotelSelect">Select Hotel:</label>
        <select id="hotelSelect" class="form-control" onchange="fetchRooms()">
            <option value="">-- Select a Hotel --</option>
        </select>
    </div>
    <button class="btn btn-create" onclick="openAddModal()" id="addRoomBtn" disabled>
        <i class="fas fa-plus"></i> Add New Room
    </button>
</div>

<div class="table-wrapper">
    <table id="roomTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Room Number</th>
            <th>Room Type</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="roomTableBody">
            <tr>
                <td colspan="5" class="empty-message">Please select a hotel to view rooms</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="roomModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Room</h3>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="roomId">
            <div class="form-group">
                <label>Room Number</label>
                <input type="number" id="roomNumber" class="form-control" placeholder="e.g., 101">
            </div>
            <div class="form-group">
                <label>Room Type</label>
                <select id="roomType" class="form-control">
                    <option value="Normal Room">Normal Room</option>
                    <option value="Vip Room">Vip Room</option>
                    <option value="Deluxe Room">Deluxe Room</option>
                    <option value="Suite">Suite</option>
                    <option value="Presidential Suite">Presidential Suite</option>
                </select>
            </div>
            <div class="form-group">
                <label>Price (VND)</label>
                <input type="number" id="roomPrice" class="form-control" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-create" id="saveRoomBtn">Save</button>
        </div>
    </div>
</div>

<script>
    // --- UTILS: TIME & MENU ---
    function updateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- LOAD HOTELS ON PAGE LOAD ---
    document.addEventListener("DOMContentLoaded", fetchHotels);

    function fetchHotels() {
        fetch("/admin/getAllHotels")
            .then(res => res.json())
            .then(data => {
                if (data.code === 1000) {
                    const select = document.getElementById("hotelSelect");
                    data.data.forEach(hotel => {
                        const option = document.createElement("option");
                        option.value = hotel.id;
                        option.textContent = `${hotel.hotelName} (${hotel.address})`;
                        select.appendChild(option);
                    });
                }
            })
            .catch(err => console.error("Error fetching hotels:", err));
    }

    // --- FETCH ROOMS FOR SELECTED HOTEL ---
    function fetchRooms() {
        const hotelId = document.getElementById("hotelSelect").value;
        const addBtn = document.getElementById("addRoomBtn");
        const tableBody = document.getElementById("roomTableBody");

        if (!hotelId) {
            addBtn.disabled = true;
            tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">Please select a hotel to view rooms</td></tr>';
            return;
        }

        addBtn.disabled = false;

        fetch(`/admin/rooms/${hotelId}`)
            .then(res => res.json())
            .then(data => {
                if (data.code === 1000) {
                    tableBody.innerHTML = "";
                    if (data.data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" class="empty-message">No rooms found for this hotel</td></tr>';
                        return;
                    }
                    data.data.forEach(room => {
                        const roomString = JSON.stringify(room).replace(/"/g, '&quot;');
                        tableBody.innerHTML += `
                            <tr>
                                <td>${room.id}</td>
                                <td>${room.roomNumber}</td>
                                <td>${room.roomType}</td>
                                <td>${room.price.toLocaleString()} VND</td>
                                <td>
                                    <button class="btn btn-edit" onclick="openEditModal(${roomString})">Edit</button>
                                    <button class="btn btn-delete" onclick="deleteRoom(${room.id})">Delete</button>
                                </td>
                            </tr>`;
                    });
                }
            })
            .catch(err => console.error("Error fetching rooms:", err));
    }

    // --- MODAL LOGIC ---
    function openAddModal() {
        document.getElementById("modalTitle").innerText = "Add Room";
        document.getElementById("roomId").value = "";
        document.getElementById("roomNumber").value = "";
        document.getElementById("roomType").value = "Normal Room";
        document.getElementById("roomPrice").value = "";
        document.getElementById("saveRoomBtn").onclick = createRoom;
        document.getElementById('roomModal').style.display = 'flex';
    }

    function openEditModal(room) {
        document.getElementById("modalTitle").innerText = "Update Room";
        document.getElementById("roomId").value = room.id;
        document.getElementById("roomNumber").value = room.roomNumber;
        document.getElementById("roomType").value = room.roomType;
        document.getElementById("roomPrice").value = room.price;
        document.getElementById("saveRoomBtn").onclick = updateRoom;
        document.getElementById('roomModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('roomModal').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    // --- ROOM API LOGIC ---
    function createRoom() {
        const hotelId = document.getElementById("hotelSelect").value;
        const newRoom = {
            roomNumber: parseInt(document.getElementById("roomNumber").value),
            roomType: document.getElementById("roomType").value,
            price: parseFloat(document.getElementById("roomPrice").value),
            hotelId: parseInt(hotelId)
        };

        fetch("/admin/room", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newRoom)
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Room added successfully!");
                fetchRooms();
                closeModal();
            } else {
                alert("Failed to add room: " + data.message);
            }
        })
        .catch(err => console.error("Error creating room:", err));
    }

    function updateRoom() {
        const id = document.getElementById("roomId").value;
        const hotelId = document.getElementById("hotelSelect").value;
        const updatedRoom = {
            roomNumber: parseInt(document.getElementById("roomNumber").value),
            roomType: document.getElementById("roomType").value,
            price: parseFloat(document.getElementById("roomPrice").value),
            hotelId: parseInt(hotelId)
        };

        fetch(`/admin/room/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedRoom)
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Room updated successfully!");
                fetchRooms();
                closeModal();
            } else {
                alert("Failed to update room: " + data.message);
            }
        })
        .catch(err => console.error("Error updating room:", err));
    }

    function deleteRoom(id) {
        if (!confirm("Are you sure you want to delete this room?")) return;

        fetch(`/admin/room/${id}`, {
            method: "DELETE"
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Room deleted successfully!");
                fetchRooms();
            } else {
                alert("Failed to delete room: " + data.message);
            }
        })
        .catch(err => console.error("Error deleting room:", err));
    }
</script>
</body>
</html>
