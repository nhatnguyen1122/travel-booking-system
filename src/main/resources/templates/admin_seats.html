<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Management | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/admin_seats.css">
</head>

<body class="hust-admin-seats">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
        <a href="admin_room">Manage Rooms</a>
        <a href="admin_contact">Manage Contacts</a>
        <a href="admin_seats" class="indam">Manage Seats</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Seat Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="action-bar">
    <div class="flight-select-group">
        <label for="flightSelect">Select Flight:</label>
        <select id="flightSelect" class="form-control">
            <option value="">-- Select a flight --</option>
        </select>
        <button class="btn btn-initialize" onclick="initializeSeats()">
            <i class="fas fa-cog"></i> Initialize Seats
        </button>
    </div>
</div>

<div class="seat-info" id="seatInfo" style="display: none;">
    <div class="info-card">
        <h3>Flight Information</h3>
        <div id="flightDetails"></div>
    </div>
    <div class="seat-legend">
        <div class="legend-item">
            <div class="seat available"></div>
            <span>Available</span>
        </div>
        <div class="legend-item">
            <div class="seat booked"></div>
            <span>Booked</span>
        </div>
    </div>
</div>

<div class="seat-map-container" id="seatMapContainer">
    <div id="seatMap" class="seat-map"></div>
</div>

<script src="/js/admin_seats.js"></script>
</body>
</html>
