<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        :root {
            /* Biến màu đồng bộ */
            --primary: #29b862;
            --primary-dark: #1e8544;
            --text-dark: #1d1d1d;
            --white: #fff;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            transition: all .2s linear;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        /* --- BACKGROUND VIDEO (ĐỒNG BỘ) --- */
        .video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .video-container video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* --- HEADER & NAVBAR (ĐỒNG BỘ) --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5%;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
        }

        header .logo span { color: var(--primary); }

        header .bar {
            display: flex;
            gap: 15px;
        }

        header .bar a {
            font-size: 0.85rem;
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        header .bar a:hover { color: var(--primary); }

        header .icons {
            display: flex;
            align-items: center;
        }

        header .icons i {
            font-size: 1.1rem;
            color: var(--white);
            cursor: pointer;
            margin-left: 10px;
        }

        header .icons i:hover { color: var(--primary); }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px; right: 5%;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 150px;
            overflow: hidden;
            flex-direction: column;
            z-index: 1001;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        /* --- CHANGE PASSWORD CONTAINER --- */
        .change-pass-container {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            box-shadow: var(--shadow);
            margin-top: 60px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .change-pass-container h2 {
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #f9f9f9;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(41, 184, 98, 0.1);
        }

        .btn-update {
            width: 100%;
            background: var(--primary);
            color: var(--white);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .btn-update:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(41, 184, 98, 0.3);
        }

        .btn-back {
            display: inline-block;
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-back:hover { color: var(--primary); }

        @media (max-width: 1200px) {
            header { padding: 1rem 2rem; }
            header .bar { display: none; }
        }

    </style>
</head>
<body>

<header>
    <a href="home" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="video-container">
    <div class="video-overlay"></div>
    <video src="images/ocean.mp4" id="video-slider" loop autoplay muted></video>
</div>

<div class="change-pass-container">
    <h2>Change Password</h2>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="user-phone" placeholder="Your phone number">
    </div>

    <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="user-password" placeholder="Enter current password">
    </div>

    <div class="form-group">
        <label>New Password</label>
        <input type="password" id="user-new-pass" placeholder="Enter new password">
    </div>

    <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="user-new-pass-confirm" placeholder="Confirm new password">
    </div>

    <button id="update-btn" class="btn-update">Update Password</button>

    <a href="/profile" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Profile</a>
</div>

<script>
    // Logic Toggle Menu
    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");

        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // Logic Change Password
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("update-btn").addEventListener("click", function () {
            let phone = document.getElementById("user-phone").value;
            let password = document.getElementById("user-password").value;
            let newPassword = document.getElementById("user-new-pass").value;
            let confirmPassword = document.getElementById("user-new-pass-confirm").value;

            if (!phone || !password || !newPassword || !confirmPassword) {
                alert("Please fill in all fields.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("New passwords do not match.");
                return;
            }

            let changePassDto = {
                phone: phone,
                password: password,
                newPassword: newPassword,
                confirmPassword : confirmPassword
            };

            fetch("/user/changePassword", {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(changePassDto)
            })
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    alert("Password changed successfully!");
                    window.location.href = "/profile";
                } else {
                    alert(`Failed: ${apiResponse.message}`);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            });
        });
    });
</script>
</body>
</html>
