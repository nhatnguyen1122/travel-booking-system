<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- CSS tách ra -->
    <link rel="stylesheet" href="/css/review.css">
</head>

<body class="hust-review-page">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review" class="indam">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<section class="review-section">
    <h1 class="heading">
        <span>r</span>
        <span>e</span>
        <span>v</span>
        <span>i</span>
        <span>e</span>
        <span>w</span>
    </h1>

    <div class="filter-section">
        <select id="hotel-filter" class="hotel-select">
            <option value="">All Hotels</option>
        </select>
        <div class="pagination-controls">
            <button id="prev-page" class="page-btn" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button id="next-page" class="page-btn">Next</button>
        </div>
    </div>

    <div id="reviews-container" class="review-container">
        <div class="loading-message">Loading reviews...</div>
    </div>
</section>

<section class="footer">
    <div class="footer-container">
        <div class="footer-col">
            <h2>About Us</h2>
            <p>Website developed by Group 14. We connect you to the world's most beautiful destinations.</p>
        </div>
    </div>
</section>

<script>
    let currentPage = 0;
    let currentHotelFilter = '';
    let totalPages = 1;

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");

        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    function loadHotels() {
        fetch('/admin/getAllHotels')
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000 && apiResponse.data) {
                    const hotelSelect = document.getElementById('hotel-filter');
                    apiResponse.data.forEach(hotel => {
                        const option = document.createElement('option');
                        option.value = hotel.id;
                        option.textContent = hotel.hotelName;
                        hotelSelect.appendChild(option);
                    });
                }
            })
            .catch(error => console.error('Error loading hotels:', error));
    }

    function renderStars(rating) {
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
            if (i <= rating) {
                starsHtml += '<i class="fas fa-star"></i>';
            } else {
                starsHtml += '<i class="far fa-star"></i>';
            }
        }
        return starsHtml;
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function loadReviews(hotelId = '', pageNo = 0) {
        const container = document.getElementById('reviews-container');
        container.innerHTML = '<div class="loading-message">Loading reviews...</div>';

        // Use /review/all for all hotels, or /review/hotel/{id} for specific hotel
        let apiUrl = hotelId
            ? `/review/hotel/${hotelId}?pageNo=${pageNo}&pageSize=8`
            : `/review/all?pageNo=${pageNo}&pageSize=8`;

        fetch(apiUrl)
            .then(response => response.json())
            .then(apiResponse => {
                if (apiResponse.code === 1000) {
                    const pageResponse = apiResponse.data;
                    const reviews = pageResponse.items || [];

                    totalPages = pageResponse.totalPages || 1;
                    currentPage = pageNo;

                    updatePaginationControls();

                    if (reviews.length === 0) {
                        container.innerHTML = hotelId 
                            ? '<div class="no-reviews-message">No reviews found for this hotel.</div>'
                            : '<div class="no-reviews-message">No reviews yet. Be the first to leave a review!</div>';
                        return;
                    }

                    container.innerHTML = reviews.map(review => `
                        <div class="review-card">
                            <div class="avatar-circle">
                                <i class="fas fa-user"></i>
                            </div>
                            <h3>${review.userName || 'Anonymous'}</h3>
                            <p class="hotel-name-tag">${review.hotelName || 'Hotel'}</p>
                            <p class="review-comment">"${review.comment || 'No comment provided.'}"</p>
                            <div class="stars">
                                ${renderStars(review.rating)}
                            </div>
                            <p class="review-date">${formatDate(review.createdAt)}</p>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error-message">Failed to load reviews.</div>';
                }
            })
            .catch(error => {
                console.error('Error loading reviews:', error);
                container.innerHTML = '<div class="error-message">Error loading reviews. Please try again later.</div>';
            });
    }

    function updatePaginationControls() {
        document.getElementById('page-info').textContent = `Page ${currentPage + 1} of ${totalPages}`;
        document.getElementById('prev-page').disabled = currentPage === 0;
        document.getElementById('next-page').disabled = currentPage >= totalPages - 1;
    }

    document.getElementById('hotel-filter').addEventListener('change', function(e) {
        currentHotelFilter = e.target.value;
        currentPage = 0;
        loadReviews(currentHotelFilter, currentPage);
    });

    document.getElementById('prev-page').addEventListener('click', function() {
        if (currentPage > 0) {
            currentPage--;
            loadReviews(currentHotelFilter, currentPage);
        }
    });

    document.getElementById('next-page').addEventListener('click', function() {
        if (currentPage < totalPages - 1) {
            currentPage++;
            loadReviews(currentHotelFilter, currentPage);
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        loadHotels();
        loadReviews('', 0);
    });
</script>

</body>
</html>
