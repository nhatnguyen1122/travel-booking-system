<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/review.css">
</head>

<body class="hust-review-page">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review" class="indam">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
        <a href="chatbot" class="ai-assistant-link"><i class="fas fa-robot"></i> AI Help</a>
    </nav>
    <div class="icons">
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<section class="review-section">
    <h1 class="heading">
        <span>r</span>
        <span>e</span>
        <span>v</span>
        <span>i</span>
        <span>e</span>
        <span>w</span>
    </h1>

    <div class="filter-section">
        <select id="hotel-filter" class="hotel-select">
            <option value="">All Hotels</option>
        </select>

        <div class="pagination-controls">
            <button id="prev-page" class="page-btn" disabled>Previous</button>
            <span id="page-info">Page 1</span>
            <button id="next-page" class="page-btn">Next</button>
        </div>
    </div>

    <div id="reviews-container" class="review-container">
        <div class="loading-message">Loading reviews...</div>
    </div>
</section>

<section class="footer">
    <div class="footer-container">
        <div class="footer-col">
            <h2>About Us</h2>
            <p>Website developed by Group 14. We connect you to the world's most beautiful destinations.</p>
        </div>
    </div>
</section>

<!-- Floating Chatbot Button -->
<a href="/chatbot" class="chatbot-float" title="AI Travel Assistant">
    <i class="fas fa-robot"></i>
</a>
<style>
.chatbot-float {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 24px;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 1000;
    text-decoration: none;
}
.chatbot-float:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}
</style>

<!-- ✅ JS tách hoàn toàn ra ngoài -->
<script src="/js/review.js"></script>

</body>
</html>
