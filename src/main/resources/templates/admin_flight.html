<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Management | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        :root {
            --primary: #29b862;
            --primary-dark: #1e8544;
            --text-dark: #1d1d1d;
            --text-light: #666;
            --white: #fff;
            --bg-light: #f9f9f9;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --radius: 12px;
            --danger: #e74c3c;
            --info: #3498db;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            transition: all .2s linear;
        }

        body {
            background-color: var(--bg-light);
            padding-top: 80px;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5%;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
        }

        header .logo span { color: var(--primary); }

        header .bar {
            display: flex;
            gap: 20px;
        }

        header .bar a {
            font-size: 0.9rem;
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        header .bar a:hover, header .bar a.indam {
            color: var(--primary);
        }

        header .icons {
            display: flex;
            align-items: center;
        }

        header .icons i {
            font-size: 1.1rem;
            color: var(--white);
            cursor: pointer;
            margin-left: 15px;
        }

        header .icons i:hover { color: var(--primary); }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px; right: 5%;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 150px;
            overflow: hidden;
            flex-direction: column;
            z-index: 1001;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        /* --- INFO BAR --- */
        .container-info {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .container-info .left p {
            font-size: 1.5rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .container-info .right {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* --- BUTTONS --- */
        .action-bar {
            padding: 0 5%;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-create { background-color: var(--primary); }
        .btn-create:hover { background-color: var(--primary-dark); }

        .btn-edit { background-color: var(--warning); padding: 6px 12px; font-size: 0.8rem;}
        .btn-delete { background-color: var(--danger); padding: 6px 12px; font-size: 0.8rem;}

        /* --- TABLE --- */
        .table-wrapper {
            padding: 0 5%;
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 0.9rem;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        tr:hover { background-color: #f1f1f1; }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h3 { color: var(--text-dark); }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: #999; }
        .close-btn:hover { color: var(--danger); }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        .form-control:focus { border-color: var(--primary); }

        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights" class="indam">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Flight Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="action-bar">
    <button class="btn btn-create" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Add New Flight
    </button>
</div>

<div class="table-wrapper">
    <table id="flight-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Class</th>
            <th>Airline</th>
            <th>Price ($)</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Total Seats</th>
            <th>Available</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<div id="addFlightModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Flight</h3>
            <span class="close-btn" onclick="closeModal('addFlightModal')">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Ticket Class</label>
                <select id="ticketClass" class="form-control">
                    <option value="BUSINESS_CLASS">BUSINESS_CLASS</option>
                    <option value="NORMAL_CLASS">NORMAL_CLASS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Airline Name</label>
                <input type="text" id="airlineName" class="form-control" placeholder="e.g. Vietnam Airlines">
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" id="price" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>Departure Date</label>
                <input type="date" id="checkInDate" class="form-control">
            </div>
            <div class="form-group">
                <label>Arrival Date</label>
                <input type="date" id="checkOutDate" class="form-control">
            </div>
            <div class="form-group">
                <label>Total Seats</label>
                <input type="number" id="numberOfChairs" class="form-control" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-create" onclick="createFlight()">Create Flight</button>
        </div>
    </div>
</div>

<div id="updateFlightModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Update Flight</h3>
            <span class="close-btn" onclick="closeModal('updateFlightModal')">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="updateFlightId">
            <div class="form-group">
                <label>Ticket Class</label>
                <select id="updateTicketClass" class="form-control">
                    <option value="BUSINESS_CLASS">BUSINESS_CLASS</option>
                    <option value="NORMAL_CLASS">NORMAL_CLASS</option>
                </select>
            </div>
            <div class="form-group">
                <label>Airline Name</label>
                <input type="text" id="updateAirlineName" class="form-control">
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" id="updatePrice" class="form-control">
            </div>
            <div class="form-group">
                <label>Departure Date</label>
                <input type="date" id="updateCheckInDate" class="form-control">
            </div>
            <div class="form-group">
                <label>Arrival Date</label>
                <input type="date" id="updateCheckOutDate" class="form-control">
            </div>
            <div class="form-group">
                <label>Total Seats</label>
                <input type="number" id="updateNumberOfChairs" class="form-control">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-create" onclick="saveUpdatedFlight()">Save Changes</button>
        </div>
    </div>
</div>

<script>
    // --- UTILS: TIME & MENU ---
    function updateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- MODAL LOGIC ---
    function openAddModal() {
        document.getElementById('addFlightModal').style.display = 'flex';
    }

    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    // --- FLIGHT API LOGIC ---
    let allFlights = []; // Store data locally to populate update modal easily

    function fetchFlights() {
        fetch("/flight/getAll")
            .then(response => response.json())
            .then(data => {
                if (data.code === 1000) {
                    allFlights = data.data;
                    renderFlightTable(allFlights);
                }
            })
            .catch(error => console.error("Error fetching flights:", error));
    }

    function renderFlightTable(flights) {
        const tableBody = document.querySelector("#flight-table tbody");
        tableBody.innerHTML = "";
        flights.forEach(flight => {
            const row = `<tr>
                <td>${flight.id}</td>
                <td>${flight.ticketClass}</td>
                <td>${flight.airlineName}</td>
                <td>${flight.price}</td>
                <td>${new Date(flight.checkInDate).toLocaleDateString()}</td>
                <td>${new Date(flight.checkOutDate).toLocaleDateString()}</td>
                <td>${flight.numberOfChairs}</td>
                <td>${flight.seatAvailable}</td>
                <td>
                    <button class='btn btn-edit' onclick='openUpdateModal(${flight.id})'>Edit</button>
                    <button class='btn btn-delete' onclick='deleteFlight(${flight.id})'>Delete</button>
                </td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    function createFlight() {
        const newFlight = {
            ticketClass: document.getElementById("ticketClass").value,
            airlineName: document.getElementById("airlineName").value,
            price: document.getElementById("price").value,
            checkInDate: document.getElementById("checkInDate").value,
            checkOutDate: document.getElementById("checkOutDate").value,
            numberOfChairs: document.getElementById("numberOfChairs").value
        };

        fetch("/flight/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newFlight)
        })
        .then(response => response.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Flight added successfully!");
                fetchFlights();
                closeModal('addFlightModal');
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(error => console.error("Error adding flight:", error));
    }

    function deleteFlight(flightId) {
        if (confirm("Are you sure you want to delete this flight?")) {
            fetch(`/flight/delete/${flightId}`, { method: "DELETE" })
                .then(response => response.json())
                .then(() => { fetchFlights(); })
                .catch(error => console.error("Error deleting flight:", error));
        }
    }

    function openUpdateModal(flightId) {
        const flight = allFlights.find(f => f.id === flightId);
        if(!flight) return;

        document.getElementById("updateFlightId").value = flight.id;
        document.getElementById("updateTicketClass").value = flight.ticketClass;
        document.getElementById("updateAirlineName").value = flight.airlineName;
        document.getElementById("updatePrice").value = flight.price;
        document.getElementById("updateCheckInDate").value = flight.checkInDate.split("T")[0];
        document.getElementById("updateCheckOutDate").value = flight.checkOutDate.split("T")[0];
        document.getElementById("updateNumberOfChairs").value = flight.numberOfChairs;

        document.getElementById('updateFlightModal').style.display = 'flex';
    }

    function saveUpdatedFlight() {
        const flightId = document.getElementById("updateFlightId").value;
        const updatedFlight = {
            ticketClass: document.getElementById("updateTicketClass").value,
            airlineName: document.getElementById("updateAirlineName").value,
            price: document.getElementById("updatePrice").value,
            checkInDate: document.getElementById("updateCheckInDate").value,
            checkOutDate: document.getElementById("updateCheckOutDate").value,
            numberOfChairs: document.getElementById("updateNumberOfChairs").value
        };

        fetch(`/flight/update/${flightId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedFlight)
        })
        .then(response => response.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Flight updated successfully!");
                fetchFlights();
                closeModal('updateFlightModal');
            } else {
                alert("Failed to update flight: " + data.message);
            }
        })
        .catch(error => console.error("Error updating flight:", error));
    }

    document.addEventListener("DOMContentLoaded", fetchFlights);
</script>
</body>
</html>
