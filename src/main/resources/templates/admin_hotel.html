<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        :root {
            --primary: #29b862;
            --primary-dark: #1e8544;
            --text-dark: #1d1d1d;
            --text-light: #666;
            --white: #fff;
            --bg-light: #f9f9f9;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --radius: 12px;
            --danger: #e74c3c;
            --info: #3498db;
            --warning: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            transition: all .2s linear;
        }

        body {
            background-color: var(--bg-light);
            padding-top: 80px;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5%;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
        }

        header .logo span { color: var(--primary); }

        header .bar {
            display: flex;
            gap: 20px;
        }

        header .bar a {
            font-size: 0.9rem;
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        header .bar a:hover, header .bar a.indam {
            color: var(--primary);
        }

        header .icons {
            display: flex;
            align-items: center;
        }

        header .icons i {
            font-size: 1.1rem;
            color: var(--white);
            cursor: pointer;
            margin-left: 15px;
        }

        header .icons i:hover { color: var(--primary); }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px; right: 5%;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 150px;
            overflow: hidden;
            flex-direction: column;
            z-index: 1001;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        /* --- INFO BAR --- */
        .container-info {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .container-info .left p {
            font-size: 1.5rem;
            color: var(--text-dark);
            font-weight: 700;
        }

        .container-info .right {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* --- BUTTONS --- */
        .action-bar {
            padding: 0 5%;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-create { background-color: var(--primary); }
        .btn-create:hover { background-color: var(--primary-dark); }

        .btn-edit { background-color: var(--warning); padding: 6px 12px; font-size: 0.8rem;}
        .btn-edit:hover { background-color: #d35400; }

        /* --- TABLE --- */
        .table-wrapper {
            padding: 0 5%;
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 0.9rem;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary);
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        tr:hover { background-color: #f1f1f1; }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .modal-header h3 { color: var(--text-dark); }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: #999; }
        .close-btn:hover { color: var(--danger); }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        .form-control:focus { border-color: var(--primary); }

        .modal-footer {
            margin-top: 20px;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel { background-color: #95a5a6; }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel" class="indam">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Hotel Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="action-bar">
    <button class="btn btn-create" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Add New Hotel
    </button>
</div>

<div class="table-wrapper">
    <table id="hotelTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Hotel Name</th>
            <th>Price From ($)</th>
            <th>Address</th>
            <th>Floors</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="hotelTableBody">
        </tbody>
    </table>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Hotel</h3>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="hotelId">
            <div class="form-group">
                <label>Hotel Name</label>
                <input type="text" id="hotelName" class="form-control" placeholder="Enter hotel name">
            </div>
            <div class="form-group">
                <label>Price From</label>
                <input type="number" id="priceFrom" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" class="form-control" placeholder="Enter address">
            </div>
            <div class="form-group">
                <label>Number of Floors</label>
                <input type="number" id="numberFloor" class="form-control" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-create" id="saveHotelBtn">Save</button>
        </div>
    </div>
</div>

<script>
    // --- UTILS: TIME & MENU ---
    function updateTime() {
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString();
        document.getElementById('currentTime').innerText = now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- MODAL LOGIC ---
    function openAddModal() {
        document.getElementById("modalTitle").innerText = "Add Hotel";
        document.getElementById("hotelId").value = "";
        document.getElementById("hotelName").value = "";
        document.getElementById("priceFrom").value = "";
        document.getElementById("address").value = "";
        document.getElementById("numberFloor").value = "";
        document.getElementById("saveHotelBtn").onclick = createHotel;
        document.getElementById('hotelModal').style.display = 'flex';
    }

    function openEditModal(hotel) {
        document.getElementById("modalTitle").innerText = "Update Hotel";
        document.getElementById("hotelId").value = hotel.id;
        document.getElementById("hotelName").value = hotel.hotelName;
        document.getElementById("priceFrom").value = hotel.hotelPriceFrom;
        document.getElementById("address").value = hotel.address;
        document.getElementById("numberFloor").value = hotel.numberFloor;
        document.getElementById("saveHotelBtn").onclick = updateHotel;
        document.getElementById('hotelModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('hotelModal').style.display = 'none';
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }

    // --- HOTEL API LOGIC ---
    document.addEventListener("DOMContentLoaded", fetchHotels);

    function fetchHotels() {
        fetch("/admin/getAllHotels")
            .then(res => res.json())
            .then(data => {
                if (data.code === 1000) {
                    const tableBody = document.getElementById("hotelTableBody");
                    tableBody.innerHTML = "";
                    data.data.forEach(hotel => {
                        // Create a safe stringified object for the onclick handler
                        const hotelString = JSON.stringify(hotel).replace(/"/g, '&quot;');

                        tableBody.innerHTML += `
                            <tr>
                                <td>${hotel.id}</td>
                                <td>${hotel.hotelName}</td>
                                <td>${hotel.hotelPriceFrom}</td>
                                <td>${hotel.address}</td>
                                <td>${hotel.numberFloor}</td>
                                <td>
                                    <button class="btn btn-edit" onclick="openEditModal(${hotelString})">Edit</button>
                                </td>
                            </tr>`;
                    });
                }
            })
            .catch(err => console.error("Error fetching hotels:", err));
    }

    function createHotel() {
        const newHotel = {
            hotelName: document.getElementById("hotelName").value,
            priceFrom: parseFloat(document.getElementById("priceFrom").value),
            address: document.getElementById("address").value,
            numberFloor: parseInt(document.getElementById("numberFloor").value)
        };

        fetch("/admin/createHotel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newHotel)
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Hotel added successfully!");
                fetchHotels();
                closeModal();
            } else {
                alert("Failed to add hotel: " + data.message);
            }
        })
        .catch(err => console.error("Error creating hotel:", err));
    }

    function updateHotel() {
        const id = document.getElementById("hotelId").value;
        const updatedHotel = {
            hotelName: document.getElementById("hotelName").value,
            priceFrom: parseFloat(document.getElementById("priceFrom").value),
            address: document.getElementById("address").value,
            numberFloor: parseInt(document.getElementById("numberFloor").value)
        };

        fetch(`/admin/updateHotel/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updatedHotel)
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 1000) {
                alert("Hotel updated successfully!");
                fetchHotels();
                closeModal();
            } else {
                alert("Failed to update hotel: " + data.message);
            }
        })
        .catch(err => console.error("Error updating hotel:", err));
    }
</script>
</body>
</html>
