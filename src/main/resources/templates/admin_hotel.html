<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- Scoped CSS -->
    <link rel="stylesheet" href="/css/admin_hotel.css">
</head>

<body class="hust-admin-hotel">

<header>
    <a href="#" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel" class="indam">Manage Hotels</a>
        <a href="admin_room">Manage Rooms</a>
        <a href="admin_contact">Manage Contacts</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="container-info">
    <div class="left">
        <p>Hotel Management</p>
    </div>
    <div class="right">
        <span><i class="fas fa-calendar-alt"></i> <span id="currentDate"></span></span> |
        <span><i class="fas fa-clock"></i> <span id="currentTime"></span></span>
    </div>
</div>

<div class="action-bar">
    <button class="btn btn-create" onclick="openAddModal()">
        <i class="fas fa-plus"></i> Add New Hotel
    </button>
</div>

<div class="table-wrapper">
    <table id="hotelTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Hotel Name</th>
            <th>Price From</th>
            <th>Address</th>
            <th>Floors</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="hotelTableBody"></tbody>
    </table>

    <!-- Pagination giống admin_booking/admin_account -->
    <div id="pagination" class="pagination"></div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Add Hotel</h3>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="hotelId">
            <div class="form-group">
                <label>Hotel Name</label>
                <input type="text" id="hotelName" class="form-control" placeholder="Enter hotel name">
            </div>
            <div class="form-group">
                <label>Price From</label>
                <input type="number" id="priceFrom" class="form-control" placeholder="0">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" class="form-control" placeholder="Enter address">
            </div>
            <div class="form-group">
                <label>Number of Floors</label>
                <input type="number" id="numberFloor" class="form-control" placeholder="0">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn btn-create" id="saveHotelBtn">Save</button>
        </div>
    </div>
</div>

<script src="/js/admin_hotel.js"></script>
</body>
</html>
