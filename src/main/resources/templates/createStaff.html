<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Employee | HUST ONEFUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <style>
        :root {
            --primary: #29b862;
            --primary-dark: #1e8544;
            --text-dark: #1d1d1d;
            --text-light: #666;
            --white: #fff;
            --bg-light: #f9f9f9;
            --shadow: 0 5px 15px rgba(0,0,0,0.1);
            --radius: 12px;
            --danger: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            transition: all .2s linear;
        }

        body {
            background-color: var(--bg-light);
            padding-top: 80px; /* Space for fixed header */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* Center form vertically */
        }

        /* --- ADMIN HEADER (ĐỒNG BỘ) --- */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 5%;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--white);
            text-transform: uppercase;
        }

        header .logo span { color: var(--primary); }

        header .bar {
            display: flex;
            gap: 20px;
        }

        header .bar a {
            font-size: 0.9rem;
            color: var(--white);
            font-weight: 500;
            white-space: nowrap;
        }

        header .bar a:hover, header .bar a.indam {
            color: var(--primary);
        }

        header .icons {
            display: flex;
            align-items: center;
        }

        header .icons i {
            font-size: 1.1rem;
            color: var(--white);
            cursor: pointer;
            margin-left: 15px;
        }

        header .icons i:hover { color: var(--primary); }

        /* --- DROPDOWN --- */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px; right: 5%;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 150px;
            overflow: hidden;
            flex-direction: column;
            z-index: 1001;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px 15px;
            color: var(--text-dark);
            font-size: 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu a:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        /* --- FORM CONTAINER --- */
        .form-container {
            background: var(--white);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        .form-container h2 {
            text-align: center;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background: #f9f9f9;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(41, 184, 98, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .btn-back:hover { color: var(--primary); }

    </style>
</head>
<body>

<header>
    <a href="#" class="logo"><span>Future</span>Wonders</a>
    <nav class="bar">
        <a href="admin_booking">Manage Trips</a>
        <a href="admin_account" class="indam">Manage Accounts</a>
        <a href="admin_flights">Manage Flights</a>
        <a href="admin_hotel">Manage Hotels</a>
    </nav>
    <div class="icons">
        <i class="fas fa-search" id="search-btn"></i>
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="form-container">
    <h2>Create New Employee</h2>
    <form id="createStaffForm">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone" placeholder="Enter phone number" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="btn-submit">Create Employee</button>
        <a href="admin_account" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Management</a>
    </form>
</div>

<script>
    // --- USER MENU LOGIC ---
    document.getElementById("user-icon").addEventListener("click", function(event) {
        event.preventDefault();
        let menu = document.getElementById("user-menu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    });

    document.addEventListener("click", function(event) {
        let userIcon = document.getElementById("user-icon");
        let menu = document.getElementById("user-menu");
        if (!userIcon.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = "none";
        }
    });

    // --- FORM SUBMIT LOGIC ---
    document.getElementById("createStaffForm").addEventListener("submit", function(event) {
        event.preventDefault();
        var formData = new FormData(this);

        // Simple validation
        if (formData.get("password") !== formData.get("confirmPassword")) {
            alert("Passwords do not match!");
            return;
        }

        var data = {
            name: formData.get("name"),
            email: formData.get("email"),
            telephone: formData.get("phone"),
            password: formData.get("password"),
            confirmPassword: formData.get("confirmPassword"),
            roles: "admin"
        };

        fetch("api/auth/createStaff", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert("Employee created successfully!");
                window.location.href = "admin_account"; // Redirect back to list
            } else {
                alert("Error: " + data.message);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while creating the employee.");
        });
    });
</script>

</body>
</html>
