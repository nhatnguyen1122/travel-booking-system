<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | HUST ONEFUTURE</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

    <!-- CSS ở /css/ -->
    <link rel="stylesheet" href="/css/change_password.css" />
</head>

<body class="hust-change-pass-page">

<header>
    <a href="home" class="logo"><span>HUST</span>ONEFUTURE</a>
    <nav class="bar">
        <a href="home">Home</a>
        <a href="booking">Booking</a>
        <a href="hotel">Hotels</a>
        <a href="flight">Flights</a>
        <a href="trending">Trending</a>
        <a href="news">News</a>
        <a href="package">Packages</a>
        <a href="services">Services</a>
        <a href="gallery">Gallery</a>
        <a href="review">Reviews</a>
        <a href="contact">Contact</a>
        <a href="plan-trip">Payment</a>
    </nav>
    <div class="icons">
        <i class="fas fa-user" id="user-icon"></i>
        <div id="user-menu" class="dropdown-menu">
            <a href="/profile">My Profile</a>
            <a href="/user">Logout</a>
        </div>
    </div>
</header>

<div class="video-container">
    <div class="video-overlay"></div>
    <video src="/images/ocean.mp4" id="video-slider" loop autoplay muted playsinline></video>
</div>

<div class="change-pass-container">
    <h2>Change Password</h2>

    <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="user-phone" placeholder="Your phone number" />
    </div>

    <div class="form-group">
        <label>Current Password</label>
        <input type="password" id="user-password" placeholder="Enter current password" />
    </div>

    <div class="form-group">
        <label>New Password</label>
        <input type="password" id="user-new-pass" placeholder="Enter new password" />
    </div>

    <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="user-new-pass-confirm" placeholder="Confirm new password" />
    </div>

    <button id="update-btn" class="btn-update" type="button">Update Password</button>

    <a href="/profile" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Profile</a>
</div>

<!-- Nhúng JS ngoài (ở /js/) -->
<script src="/js/change_password.js"></script>
</body>
</html>
